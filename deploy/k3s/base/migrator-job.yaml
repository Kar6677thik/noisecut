# One-shot: apply SQL migrations and seed data (idempotent). The deploy workflow re-creates it for every release and waits for
# it to complete before rolling out services, so a release never runs against an older schema.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrator
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: migrator
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: noisecut-registry
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrator
          image: noisecut-migrator
          envFrom:
            - configMapRef: { name: noisecut-config }
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: noisecut-secrets, key: POSTGRES_PASSWORD }
            - name: ConnectionStrings__Postgres
              value: Host=postgres;Port=5432;Database=noisecut;Username=noisecut;Password=$(POSTGRES_PASSWORD);GSS Encryption Mode=Disable
            - name: Seed__OrdersPerSimMinute
              value: "60"
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
