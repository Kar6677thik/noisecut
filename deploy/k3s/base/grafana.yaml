# Grafana: public and read-only (anonymous Viewer), served under /grafana on the public hostname (ADR-0010).
# The Cloudflare tunnel routes https://<host>/grafana* to this NodePort; everything else on the host goes to the Api.
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30531
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:13.2.4
          env:
            - name: GF_SERVER_DOMAIN
              valueFrom:
                configMapKeyRef: { name: noisecut-public, key: hostname }
            # Visitors use https (Cloudflare terminates TLS); Grafana itself speaks plain http inside the cluster.
            - name: GF_SERVER_ROOT_URL
              value: "https://$(GF_SERVER_DOMAIN)/grafana/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: noisecut-secrets, key: GRAFANA_ADMIN_PASSWORD }
            - name: GF_SECURITY_COOKIE_SECURE
              value: "true"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/noisecut-overview.json
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /grafana/api/health, port: http }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: provisioning-datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: provisioning-dashboards, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
            - { name: data, mountPath: /var/lib/grafana }
      volumes:
        - name: provisioning-datasources
          configMap:
            name: grafana-provisioning
            items: [{ key: datasource.yml, path: prometheus.yml }]
        - name: provisioning-dashboards
          configMap:
            name: grafana-provisioning
            items: [{ key: dashboards.yml, path: noisecut.yml }]
        - name: dashboards
          configMap: { name: grafana-dashboards }
        - name: data
          emptyDir: {}      # nothing to keep: dashboards and the datasource are provisioned from git
