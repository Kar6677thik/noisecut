# Prometheus scrape configuration for the local stack.
# Every NoiseCut service exposes metrics on its internal port 9464 (never published to the host or the internet).
# dns_sd_configs resolve the Compose service name to *all* its replicas, so `--scale engine=3` gives three targets,
# each with its own `instance` label. That is how Break #4 sees each engine's partial view of a zone.

global:
  scrape_interval: 5s        # short, because experiments last minutes, not days
  evaluation_interval: 5s

scrape_configs:
  - job_name: noisecut
    dns_sd_configs:
      - names: [simulator, engine, notifier, api]
        type: A
        port: 9464
        refresh_interval: 5s
    relabel_configs:
      # Keep the Compose service name as a "service" label (derived from the DNS name that found the target).
      - source_labels: [__meta_dns_name]
        target_label: service

  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
